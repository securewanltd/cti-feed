name: Auto Update Blacklist

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest        # ← windows-latest yerine
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests tqdm

      - name: Run update_blacklist.py
        run: python update_blacklist.py
      - name: Run sha256Bot.py
        run: python sha256Bot.py
      - name: Run asn_blk_list_builder.py
        run: python asn_blk_list_builder.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update blacklist" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
